<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champion Detail</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0d14;
    --panel: #12151f;
    --panel-alt: #171b28;
    --border: #262b3a;
    --gold: #c9a15c;
    --gold-dim: #8a7448;
    --text: #e7e9ee;
    --text-dim: #838ba0;
    --pick: #5da9e0;
    --win: #4fbf82;
    --ban: #e0605a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 32px 16px 80px;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 20px;
  }

  .back-link:hover { color: var(--gold); }

  .header-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }

  .champion-icon-large {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    border: 1px solid var(--border);
    object-fit: cover;
    background: var(--panel-alt);
    flex-shrink: 0;
  }

  .champion-icon-large.icon-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--text-dim);
  }

  h1 {
    font-size: 28px;
    font-weight: 650;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .eyebrow {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .eyebrow .dot {
    width: 5px;
    height: 5px;
    background: var(--gold);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .rule {
    height: 1px;
    background: linear-gradient(90deg, var(--gold-dim), transparent);
    margin-bottom: 24px;
  }

  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .segmented-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
    flex-wrap: wrap;
  }

  .segmented-toggle button {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 550;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }

  .segmented-toggle button:hover { color: var(--text); }

  .segmented-toggle button.active {
    background: var(--panel-alt);
    color: var(--gold);
  }

  .role-icon {
    width: 15px;
    height: 15px;
    object-fit: contain;
    flex-shrink: 0;
    opacity: 0.65;
  }

  .segmented-toggle button.active .role-icon { opacity: 1; }

  .view-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
    gap: 2px;
  }

  .view-toggle button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 550;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }

  .view-toggle button:hover { color: var(--text); }

  .view-toggle button.active {
    background: var(--panel-alt);
    color: var(--gold);
  }

  .chart-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .chart-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
  }

  .chart-canvas-wrap {
    position: relative;
    height: 220px;
  }

  .loading, .error, .empty-state {
    color: var(--text-dim);
    font-size: 14px;
    padding: 20px 0;
  }

  .stats-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .stats-card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .stats-card-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }

  .stat-row:last-child {
    border-bottom: none;
  }

  .stat-row-label {
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .stat-row-value {
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    h1 { font-size: 22px; }
    .champion-icon-large { width: 48px; height: 48px; }
  }
</style>
</head>
<body>

<div class="page">
  <a href="index.html" class="back-link">&larr; Back to champion list</a>

  <div class="header-row">
    <span id="header-icon-slot"></span>
    <h1 id="championName">Loading...</h1>
  </div>
  <div class="eyebrow" id="eyebrow"><span class="dot"></span> Loading...</div>
  <div class="rule"></div>

  <div class="layout">
    <div id="content">
      <div class="loading">Loading champion data...</div>
    </div>
    <div id="statsSidebar"></div>
  </div>
</div>

<script>
  const DDRAGON_FALLBACK_VERSION = "14.16.1";
  const EXTENDED_STATS_FOLDER_NAME = "extended_stats";
  const MIN_PICKRATE_FOR_ROLE_SWITCH = 5;
  const ROLE_LABELS = {
    TOP: "Top",
    JUNGLE: "Jungle",
    MIDDLE: "Mid",
    BOTTOM: "ADC",
    UTILITY: "Support"
  };
  const ROLE_ICON_KEYS = {
    TOP: "top",
    JUNGLE: "jungle",
    MIDDLE: "middle",
    BOTTOM: "bottom",
    UTILITY: "utility"
  };
  const GROUP_BY_OPTIONS = [
    { key: "day", label: "Day" },
    { key: "patch", label: "Patch" }
  ];

  // Порядок и подписи полей в правой колонке Champion Stats. key должен
  // совпадать с ключом, который отдаёт get_champion_extended_stats() на
  // бэкенде (см. database.py). suffix добавляется к отформатированному
  // числу (обычно "%"), decimals - число знаков после запятой.
  const EXTENDED_STAT_FIELDS = [
    { key: "kills", label: "Kills", decimals: 1 },
    { key: "deaths", label: "Deaths", decimals: 1 },
    { key: "assists", label: "Assists", decimals: 1 },
    { key: "solo_kills", label: "Solo Kills", decimals: 1 },
    { key: "kill_participation_pct", label: "KP", decimals: 0, suffix: "%" },
    { key: "first_blood_pct", label: "First Blood", decimals: 1, suffix: "%" },
    { key: "physical_dmg", label: "Physical DMG", decimals: 0, thousands: true },
    { key: "magic_dmg", label: "Magic DMG", decimals: 0, thousands: true },
    { key: "dmg_taken", label: "DMG Taken", decimals: 0, thousands: true },
    { key: "team_dmg_pct", label: "Team DMG %", decimals: 0, suffix: "%" },
    { key: "dmg_per_min", label: "DMG/min", decimals: 0 },
    { key: "cs_per_min", label: "CS/min", decimals: 1 },
    { key: "gold_per_min", label: "Gold/min", decimals: 0 },
    { key: "vision_per_min", label: "Vision/min", decimals: 2 },
    { key: "control_wards", label: "Control Wards", decimals: 1 }
  ];

  let ddragonVersion = DDRAGON_FALLBACK_VERSION;
  let historyData = null;
  let extendedStatsData = null;
  let selectedRole = "ALL";
  let groupBy = "day";
  let charts = { winrate: null, pickrate: null, banrate: null };

  function getChampionNameFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("name") || "";
  }

  async function getDdragonVersion() {
    try {
      const res = await fetch("https://ddragon.leagueoflegends.com/api/versions.json");
      const versions = await res.json();
      return versions[0];
    } catch (err) {
      return DDRAGON_FALLBACK_VERSION;
    }
  }

  async function getChampionKeyToDisplayNameMap(version) {
    try {
      const res = await fetch(`https://ddragon.leagueoflegends.com/cdn/${version}/data/en_US/champion.json`);
      const data = await res.json();
      const map = {};
      for (const champKey in data.data) {
        map[champKey] = data.data[champKey].name;
      }
      return map;
    } catch (err) {
      return {};
    }
  }

  function championIconUrl(championName, version) {
    return `https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${championName}.png`;
  }

  function roleIconUrl(role) {
    const key = ROLE_ICON_KEYS[role];
    if (!key) return null;
    return `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/icon-position-${key}.png`;
  }

  function roleIconHtml(role) {
    // Community Dragon - неофициальный, community-run сервис, без гарантии
    // аптайма (в отличие от официального ddragon.leagueoflegends.com,
    // используемого для иконок чемпионов). Поэтому обязателен fallback -
    // если картинка не грузится, показываем просто буквенный лейбл роли
    // без иконки, ничего не ломая.
    const url = roleIconUrl(role);
    if (!url) return "";
    return `<img class="role-icon" src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`;
  }

  function roleLabelOf(role) {
    return ROLE_LABELS[role] || role;
  }

  function sumField(entries, field) {
    return entries.reduce((total, entry) => total + entry[field], 0);
  }

  function computeRolePickrates(history) {
    // Пикрейт роли ОТНОСИТЕЛЬНО СУММЫ ИГР САМОГО ЧЕМПИОНА (не всего
    // патча) - используется только для решения, какие роли показать в
    // переключателе сверху. Пример: если у чемпиона 60% его собственных
    // игр пришлось на лес и 40% на топ, обе роли пройдут порог 5%, даже
    // если в масштабе всего патча у чемпиона в сумме мало пиков. games
    // каждой роли суммируется по всем дням истории.
    const gamesByRole = {};
    history.forEach(entry => {
      gamesByRole[entry.role] = (gamesByRole[entry.role] || 0) + entry.games;
    });

    const totalChampionGames = Object.values(gamesByRole).reduce((sum, g) => sum + g, 0);

    const pickrates = {};
    Object.keys(gamesByRole).forEach(role => {
      pickrates[role] = totalChampionGames > 0 ? (gamesByRole[role] / totalChampionGames * 100) : 0;
    });
    return pickrates;
  }

  function getVisibleRoles(history) {
    // "All" всегда первый. Остальные роли - только если их доля среди
    // ИГР САМОГО ЧЕМПИОНА больше 5% - тот же принцип плавающего списка,
    // что и в основной таблице сайта, но с другой базой расчёта (там -
    // % от всего патча, здесь - % от игр этого конкретного чемпиона).
    const pickrates = computeRolePickrates(history);
    const roles = Object.keys(pickrates)
      .filter(role => pickrates[role] > MIN_PICKRATE_FOR_ROLE_SWITCH)
      .sort((a, b) => pickrates[b] - pickrates[a]);

    return [{ role: "ALL", pickrate: null }, ...roles.map(role => ({ role, pickrate: pickrates[role] }))];
  }

  function filterHistoryByRole(history, role) {
    if (role === "ALL") return history;
    return history.filter(entry => entry.role === role);
  }

  function groupHistoryByPeriod(history, groupByKey) {
    // Схлопывает записи истории (уже отфильтрованные по роли) в точки
    // графика по выбранному периоду - суммирует сырые games/wins/bans/
    // matches_processed внутри периода, проценты считаются из этих сумм
    // ПОСЛЕ группировки, не усредняются по дням внутри периода (тот же
    // принцип, что и во всём остальном проекте).
    //
    // Если чемпион встречается в нескольких ролях в один день (режим
    // "All"), несколько записей с одной датой сначала схлопываются в
    // одну дневную точку (games/wins суммируются, matches_processed
    // берётся один раз через Set по датам, чтобы не задвоить).

    const byDate = {};
    history.forEach(entry => {
      if (!byDate[entry.date]) {
        byDate[entry.date] = { date: entry.date, patch: entry.patch, games: 0, wins: 0, bans: entry.bans, matches_processed: entry.matches_processed };
      }
      byDate[entry.date].games += entry.games;
      byDate[entry.date].wins += entry.wins;
      // bans - это баны ИМЕННО ЗА ЭТОТ ДЕНЬ (не накопительно, worker.py
      // считает их заново на каждое окно сбора). Внутри одного дня баны
      // одинаковы у всех ролей чемпиона (не привязаны к роли) - поэтому
      // не прибавляем повторно на каждую роль, просто фиксируем значение
      // один раз при создании записи для этой даты (выше). Но МЕЖДУ
      // разными днями баны суммируются как обычный дневной счётчик -
      // это происходит ниже, при суммировании через sumField.
    });

    const dailyPoints = Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));

    if (groupByKey === "patch") {
      // Одна точка НА КАЖДЫЙ патч (не одна точка на всю историю) - для
      // каждого патча суммируем games/wins/bans/matches_processed по всем
      // его дням, подписываем номером патча. Текущий (ещё не закрытый)
      // патч тоже попадает сюда - просто с суммой по тем дням, что уже
      // успели собраться на сегодня.
      const byPatch = {};
      dailyPoints.forEach(point => {
        if (!byPatch[point.patch]) {
          byPatch[point.patch] = [];
        }
        byPatch[point.patch].push(point);
      });

      return Object.keys(byPatch).sort().map(patch => {
        const points = byPatch[patch];
        return {
          label: `Patch ${patch}`,
          games: sumField(points, "games"),
          wins: sumField(points, "wins"),
          bans: sumField(points, "bans"),
          matches_processed: sumField(points, "matches_processed")
        };
      });
    }

    // "Day" - точка на каждый день, без группировки.
    return dailyPoints.map(point => ({
      label: point.date,
      games: point.games,
      wins: point.wins,
      bans: point.bans,
      matches_processed: point.matches_processed
    }));
  }

  function toChartPoints(groupedPeriods) {
    return groupedPeriods.map(period => ({
      label: period.label,
      winrate: period.games > 0 ? round2(period.wins / period.games * 100) : 0,
      pickrate: period.matches_processed > 0 ? round2(period.games / period.matches_processed * 100) : 0,
      banrate: period.matches_processed > 0 ? round2(period.bans / (period.matches_processed * 2) * 100) : 0
    }));
  }

  function round2(num) {
    return Math.round(num * 100) / 100;
  }

  function formatPercent(num) {
    // 1 знак после запятой, но без него, если дробная часть нулевая -
    // 51 вместо 51.0, но 51.4 остаётся 51.4.
    const rounded = Math.round(num * 10) / 10;
    return rounded % 1 === 0 ? rounded.toFixed(0) : rounded.toFixed(1);
  }

  function championIconHtml(championName, version) {
    const initials = championName.replace(/[a-z']/g, '').slice(0, 2) || championName.slice(0, 2).toUpperCase();
    return `<img id="championIconLarge" class="champion-icon-large" src="${championIconUrl(championName, version)}" alt="${championName}" loading="lazy"
      onerror="this.outerHTML='<div id=&quot;championIconLarge&quot; class=&quot;champion-icon-large icon-fallback&quot;>${initials}</div>'">`;
  }

  function buildChart(canvasId, points, valueKey, colorVar, label) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");

    const rootStyles = getComputedStyle(document.documentElement);
    const color = rootStyles.getPropertyValue(colorVar).trim();
    const textDim = rootStyles.getPropertyValue("--text-dim").trim();
    const border = rootStyles.getPropertyValue("--border").trim();

    const gradient = ctx.createLinearGradient(0, 0, 0, 220);
    gradient.addColorStop(0, color + "55");
    gradient.addColorStop(1, color + "05");

    if (charts[canvasId]) {
      charts[canvasId].destroy();
    }

    charts[canvasId] = new Chart(ctx, {
      type: "line",
      data: {
        labels: points.map(p => p.label),
        datasets: [{
          label: label,
          data: points.map(p => p[valueKey]),
          borderColor: color,
          backgroundColor: gradient,
          fill: true,
          tension: 0.35,
          pointRadius: points.length > 40 ? 0 : 2,
          pointHoverRadius: 5,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (context) => `${label}: ${formatPercent(context.parsed.y)}%`
            }
          }
        },
        scales: {
          x: {
            grid: { color: border },
            ticks: { color: textDim, maxTicksLimit: 8, font: { size: 11 } }
          },
          y: {
            min: 0,
            grid: { color: border },
            ticks: { color: textDim, font: { size: 11 }, callback: (value) => formatPercent(value) + "%" }
          }
        }
      }
    });
  }

  function renderCharts() {
    if (!historyData) return;

    const roleFiltered = filterHistoryByRole(historyData.history, selectedRole);
    const grouped = groupHistoryByPeriod(roleFiltered, groupBy);
    const points = toChartPoints(grouped);

    if (points.length === 0) {
      document.getElementById("content").innerHTML = `<div class="empty-state">No data for this role yet.</div>`;
      return;
    }

    buildChart("winrate", points, "winrate", "--win", "Win Rate");
    buildChart("pickrate", points, "pickrate", "--pick", "Pick Rate");
    buildChart("banrate", points, "banrate", "--ban", "Ban Rate");

    renderStatsSidebar();
  }

  function formatStatValue(rawValue, field) {
    const rounded = field.decimals > 0
      ? rawValue.toFixed(field.decimals)
      : Math.round(rawValue).toString();

    const withThousands = field.thousands
      ? Number(rounded).toLocaleString("en-US")
      : rounded;

    return withThousands + (field.suffix || "");
  }

  function renderStatsSidebar() {
    const sidebar = document.getElementById("statsSidebar");

    // Расширенной статы может не быть вообще (файл ещё не экспортирован
    // воркером, или чемпион ни разу не пикался в текущем патче) - тогда
    // просто ничего не показываем в колонке, без ошибки.
    if (!extendedStatsData || !extendedStatsData.stats_by_role) {
      sidebar.innerHTML = "";
      return;
    }

    // Синхронизируем колонку с уже выбранной ролью в roleToggle выше по
    // странице. Если для этой конкретной роли статов ещё нет (например,
    // роль видна в графиках, потому что есть pickrate/winrate история, но
    // расширенная стата по ней ещё не набралась) - сайдбар просто прячется,
    // без пустых нулевых строк.
    const stats = extendedStatsData.stats_by_role[selectedRole];
    if (!stats) {
      sidebar.innerHTML = "";
      return;
    }

    const roleLabel = selectedRole === "ALL" ? "All roles" : roleLabelOf(selectedRole);

    const rowsHtml = EXTENDED_STAT_FIELDS.map(field => {
      const rawValue = stats[field.key];
      if (rawValue === undefined) return "";
      return `
        <div class="stat-row">
          <span class="stat-row-label">${field.label}</span>
          <span class="stat-row-value">${formatStatValue(rawValue, field)}</span>
        </div>
      `;
    }).join("");

    sidebar.innerHTML = `
      <div class="stats-card">
        <div class="stats-card-title">Champion Stats</div>
        <div class="stats-card-subtitle">${roleLabel} &middot; Patch ${extendedStatsData.patch} &middot; ${stats.games} games</div>
        ${rowsHtml}
      </div>
    `;
  }

  function setupRoleToggle() {
    const roles = getVisibleRoles(historyData.history);
    const toggle = document.getElementById("roleToggle");

    toggle.innerHTML = roles.map(r => {
      const label = r.role === "ALL" ? "All" : `${roleLabelOf(r.role)} (${formatPercent(r.pickrate)}%)`;
      const icon = r.role === "ALL" ? "" : roleIconHtml(r.role);
      return `<button type="button" data-role="${r.role}">${icon}${label}</button>`;
    }).join("");

    const buttons = toggle.querySelectorAll("button");
    const syncActive = () => {
      buttons.forEach(btn => btn.classList.toggle("active", btn.dataset.role === selectedRole));
    };
    syncActive();

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.role === selectedRole) return;
        selectedRole = btn.dataset.role;
        syncActive();
        renderCharts();
      });
    });
  }

  function setupGroupByToggle() {
    const toggle = document.getElementById("groupByToggle");
    toggle.innerHTML = GROUP_BY_OPTIONS.map(o =>
      `<button type="button" data-group="${o.key}">${o.label}</button>`
    ).join("");

    const buttons = toggle.querySelectorAll("button");
    const syncActive = () => {
      buttons.forEach(btn => btn.classList.toggle("active", btn.dataset.group === groupBy));
    };
    syncActive();

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.group === groupBy) return;
        groupBy = btn.dataset.group;
        syncActive();
        renderCharts();
      });
    });
  }

  async function init() {
    const championName = getChampionNameFromUrl();
    if (!championName) {
      document.getElementById("content").innerHTML = `<div class="error">No champion specified. Go back and click a champion name.</div>`;
      return;
    }

    try {
      const version = await getDdragonVersion();
      ddragonVersion = version;

      const [historyRes, extendedStatsRes, nameMap] = await Promise.all([
        fetch(`history/${championName}.json`),
        // Расширенная стата - необязательный файл (его может не быть,
        // если чемпион не пикался в текущем патче, или воркер ещё не
        // экспортировал extended_stats/ после обновления) - поэтому 404
        // здесь не бросает ошибку всей страницы, просто скрывает колонку.
        fetch(`${EXTENDED_STATS_FOLDER_NAME}/${championName}.json`).catch(() => null),
        getChampionKeyToDisplayNameMap(version)
      ]);

      if (!historyRes.ok) throw new Error(`No history data found for ${championName}`);

      historyData = await historyRes.json();

      if (extendedStatsRes && extendedStatsRes.ok) {
        extendedStatsData = await extendedStatsRes.json();
      } else {
        extendedStatsData = null;
      }

      const displayName = nameMap[championName] || championName;
      document.title = `${displayName} - Champion Detail`;
      document.getElementById("championName").textContent = displayName;
      document.getElementById("header-icon-slot").outerHTML = championIconHtml(championName, version);
      document.getElementById("eyebrow").innerHTML =
        `<span class="dot"></span> GRANDMASTER + CHALLENGER`;

      document.getElementById("content").innerHTML = `
        <div class="toggle-row">
          <div class="segmented-toggle" id="roleToggle"></div>
          <div class="view-toggle" id="groupByToggle"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Win Rate</div>
          <div class="chart-canvas-wrap"><canvas id="winrate"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Pick Rate</div>
          <div class="chart-canvas-wrap"><canvas id="pickrate"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Ban Rate</div>
          <div class="chart-canvas-wrap"><canvas id="banrate"></canvas></div>
        </div>
      `;

      setupRoleToggle();
      setupGroupByToggle();
      renderCharts();
    } catch (err) {
      document.getElementById("content").innerHTML =
        `<div class="error">Loading error: ${err.message}.</div>`;
    }
  }

  init();
</script>
</body>
</html>
